name: .NET runtime

on:
  push:
    paths:
      - dotnet/**
      - tools/*dotnet*.py
      - src/shojiwm/src/ssd/**
      - src/shojiwm/src/runtime_input.rs
      - Cargo.lock
      - src/shojiwm/Cargo.toml
      - .github/workflows/dotnet.yml
  pull_request:
    paths:
      - dotnet/**
      - tools/*dotnet*.py
      - src/shojiwm/src/ssd/**
      - src/shojiwm/src/runtime_input.rs
      - Cargo.lock
      - src/shojiwm/Cargo.toml
      - .github/workflows/dotnet.yml

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Generate and verify bindings
        run: |
          python3 tools/generate-dotnet-bindings.py
          python3 tools/generate-dotnet-bindings.py --check
          python3 tools/test-dotnet-generator.py
      - name: Build and test (BCL only)
        run: |
          dotnet build dotnet/ShojiWM.Tests/ShojiWM.Tests.csproj --configuration Release --disable-build-servers -m:1
          dotnet run --project dotnet/ShojiWM.Tests/ShojiWM.Tests.csproj --configuration Release --no-build
      - uses: dtolnay/rust-toolchain@stable
      - name: Exercise real hostfxr and production host thread (headless)
        run: |
          cargo run --locked --manifest-path dotnet/NativeHost.Tests/Cargo.toml -- \
            "$PWD/dotnet/ShojiWM.Runtime/bin/Release/net10.0/ShojiWM.Runtime.dll" \
            "$PWD/dotnet/ShojiWM.Tests/bin/Release/net10.0/ShojiWM.Tests.dll"
